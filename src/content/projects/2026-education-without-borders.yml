title: Education without Borders
year: 2024
summary: >-
  **Education Without Borders** was an immersive mixed-reality initiative
  developed to explore how emerging technologies can create more accessible,
  engaging, and future-focused learning experiences. The project used extended
  reality to demonstrate how digital environments can move learning beyond the
  limitations of the traditional classroom, enabling participants to interact
  with educational content in more experiential and embodied ways.


  The project was showcased during a high-level institutional visit attended by senior RMIT leadership, including the Chancellor and Vice-Chancellor. My contribution involved supporting the development and presentation of the mixed-reality experience, translating educational ideas into an accessible demonstration that highlighted the potential of immersive media in higher education.


  The project strengthened conversations around technology-enhanced learning, interdisciplinary collaboration, and the role of immersive media in shaping inclusive and innovative educational experiences.
