title: "Regenerating Heritage: Student-Led 3D Preservation of Vietnamese Cultural Sites"
year: 2025
summary: Students in RMIT Vietnam's Fundamentals of Creative 3D course have reconstructed more than 50 Vietnamese heritage sites in Blender. Each cohort expands a living digital archive, combining industry-ready 3D skills with cultural stewardship and regenerative design education.
