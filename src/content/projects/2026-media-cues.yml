title: Media Cues
year: 2025
summary: >-
  **Media Cues** is an educational board game designed to support active and
  collaborative learning in media and communication education. Developed through
  an educational innovation initiative, the game transforms key media concepts
  into an interactive classroom experience where participants respond to
  prompts, discuss interpretations, and apply theoretical ideas to practical
  scenarios.


  The project was created to make concept-heavy learning more accessible, engaging, and discussion-driven. By encouraging peer interaction and collaborative problem-solving, Media Cues helps students build media literacy, critical thinking, and confidence in communicating complex ideas.


  The game was also shared through a staff Community of Practice, supporting wider conversations about playful learning, classroom engagement, and the use of game-based approaches in higher education.
