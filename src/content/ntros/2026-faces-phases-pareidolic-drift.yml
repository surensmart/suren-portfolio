title: "Faces / Phases: Pareidolic Drift"
type: NTRO
year: 2026
award_status: Silver Winner
collaborators: Ricardo Arce & Renusha Athugala
description: "Faces / Phases: Pareidolic Drift is a digitally composed mosaic
  that examines how viewers construct meaning from ambiguous images, and how
  machine systems can amplify rather than replace this distinctly human act of
  seeing. The work is built from an archive of over 800 original
  pareidolia-triggering photographs captured by the lead artist across multiple
  countries over a ten-year period — faces glimpsed in walls, windows,
  machinery, food, and the weathered surfaces of the everyday world. A custom
  AI-assisted tool was developed to arrange these photographs into a single
  high-resolution mosaic in which the small images function as pixels, forming
  an emergent face-like configuration at distance. None of the individual images
  are AI-generated; the algorithm composes, it does not author. Presented as a
  passive print installation, the work invites slow spectatorship — proposing
  that faces are not found in images but produced through memory, attention, and
  context."
