title: Teaching & Learning Philosophy
quote: Every student can learn, just not on the same day, or in the same way.
quote_author: George Evans
introduction: I believe creative learners thrive when they feel trusted,
  challenged, and safe to experiment. My teaching combines practical making,
  collaboration, timely feedback, and current industry practice so that complex
  ideas become approachable and memorable.
sections:
  - title: Learning through practice
    text: My classes in 3D, graphic design, photography, interaction, games, and
      immersive media are grounded in hands-on learning. Even theory is paired
      with real-life examples, role play, demonstrations, and purposeful
      challenges. I allow room for non-destructive mistakes, then guide students
      through the point where their thinking or process changed.
  - title: Playful, technology-rich engagement
    text: I use learning platforms, collaborative quizzes, smartboards, virtual
      reality, and interactive activities to wrap challenge in a sense of play.
      Creative minds flourish when learners have freedom to try unfamiliar
      approaches in a friendly and inclusive environment.
  - title: Collaboration as preparation
    text: Team projects, group discussions, think-pair-share, jigsaw activities, and
      flipped classes develop peer learning beyond the classroom. This also
      reflects the collaborative realities of film, games, animation, design,
      and other creative industries.
  - title: Feedback that changes the semester
    text: I collect anonymous early feedback around the fourth week, again at
      mid-semester, and at the end. Asking about clarity, relevance, learning
      methods, respect, and subject knowledge early enough allows student
      suggestions to improve the course they are currently taking.
  - title: Designing for future careers
    text: Students enter the job market years after a course begins, so I refresh
      content continuously, connect learning to contemporary tools and
      workflows, and use industry visits and applied briefs. The goal is not
      simply to complete a syllabus but to build adaptable, confident, job-ready
      creative practitioners.
  - title: Where the journey began
    text: My passion for teaching emerged while completing my master's degree at
      Liverpool John Moores University. After industry experience in 3D
      lighting, I was invited to teach an international undergraduate group.
      Their response to my ability to explain complex material simply convinced
      me that academia was where I could make the strongest contribution.
